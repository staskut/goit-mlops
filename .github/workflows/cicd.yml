name: MLOps CI/CD - Retrain and Deploy

on:
  # 1. Ручний запуск з інтерфейсу GitHub
  workflow_dispatch:

  # 2. Webhook-тригер, який викликає наш FastAPI сервіс
  repository_dispatch:
    types: [drift_detected]

  # 3. (Опціонально) Тригер при пуші в main, якщо ви хочете оновлювати на кожен коміт
  # push:
  #   branches: [ "main" ]

# Змінні оточення, які будуть доступні в усіх jobs
env:
  # Замініть на ваш AWS регіон
  AWS_REGION: "eu-west-2"
  # Замініть на назву вашого ECR репозиторію
  ECR_REPOSITORY: "865683084473.dkr.ecr.eu-west-2.amazonaws.com/goit-mlops-repo"

# Дозвіл для GitHub Actions, щоб воно могло пушити коміти (для оновлення values.yaml)
permissions:
  contents: write

jobs:
  retrain-build-and-deploy:
    name: Retrain, Build, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Training Dependencies
        run: pip install -r model/requirements.txt

      - name: Run Retraining Script
        run: python model/train.py
        # Цей скрипт оновить model.pkl та drift_detector.pkl у папці app/

      - name: Generate Image Tag
        id: image_tag
        run: |
          # Генеруємо унікальний тег (короткий хеш коміта + час)
          TAG=$(echo "$(git rev-parse --short HEAD)-$(date +%s)")
          echo "::set-output name=tag::$TAG"

      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f app/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Також тегуємо як latest для стабільності
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Install yq (для оновлення YAML)
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.30.8/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update Helm values.yaml
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
          ECR_REGISTRY_URL: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          # Оновлюємо репозиторій та тег в helm/values.yaml
          yq e -i '.image.repository = env(ECR_REGISTRY_URL)' helm/values.yaml
          yq e -i '.image.tag = env(IMAGE_TAG)' helm/values.yaml
          echo "Updated helm/values.yaml with tag $IMAGE_TAG"

      - name: Commit and Push values.yaml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          # Перевіряємо, чи є зміни, щоб не робити пустих комітів
          git diff --staged --quiet || git commit -m "ci: update image tag to ${{ steps.image_tag.outputs.tag }}"
          git push