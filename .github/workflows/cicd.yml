name: 'MLOps - Full Retrain and Deploy'

on:
  workflow_dispatch:
  repository_dispatch:
    types: [drift_detected]

env:
  AWS_REGION: "eu-west-2" # <-- ЗАМІНІТЬ НА ВАШ РЕГІОН
  ECR_REPOSITORY: "865683084473.dkr.ecr.eu-west-2.amazonaws.com/goit-mlops-repo" # <-- ЗАМІНІТЬ НА НАЗВУ ВАШОГО ECR РЕПО
  PROJECT_DIR: "aiops-quality-project"

permissions:
  contents: write

jobs:
  retrain-build-and-deploy:
    name: Retrain, Build, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Training Dependencies
        run: pip install -r $PROJECT_DIR/model/requirements.txt

      - name: Run Retraining Script
        run: python $PROJECT_DIR/model/train.py

      - name: Generate Image Tag
        id: image_tag
        run: |
          TAG=$(echo "$(git rev-parse --short HEAD)-$(date +%s)")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          # Цей рядок шукає Dockerfile у корені, як ви і хотіли
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.30.8/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update Helm values.yaml
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
          ECR_REGISTRY_URL: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          yq e -i '.image.repository = env(ECR_REGISTRY_URL)' helm/values.yaml
          yq e -i '.image.tag = env(IMAGE_TAG)' helm/values.yaml

      - name: Commit and Push values.yaml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --staged --quiet || git commit -m "ci: update image tag to ${{ steps.image_tag.outputs.tag }}"
          git push