apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-quality-project
  # Деплоїмо ArgoCD додаток у неймспейс argocd
  namespace: argocd
spec:
  project: default

  source:
    # URL вашого Git-репозиторію
    repoURL: "https://github.com/staskut/goit-mlops.git"
    # ArgoCD буде дивитися на HEAD (останній коміт)
    targetRevision: final-project
    # Шлях до нашого Helm-чарту всередині репозиторію
    path: helm

  destination:
    # Деплоїмо в той самий кластер, де працює ArgoCD
    server: "https://kubernetes.default.svc"
    # Неймспейс, куди буде задеплоєно наш сервіс
    namespace: mlops-app

  syncPolicy:
    automated:
      # Дозволяємо ArgoCD видаляти ресурси, яких більше немає в Git
      prune: true
      # Дозволяємо ArgoCD виправляти зміни, зроблені вручну в кластері
      selfHeal: true
    syncOptions:
      # Автоматично створювати неймспейс 'mlops-app', якщо його немає
      - CreateNamespace=true